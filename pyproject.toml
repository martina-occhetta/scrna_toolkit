[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrna-toolkit"
version = "0.1.0"
description = "Reusable single-cell RNA-seq ingestion, metadata harmonisation, QC and preprocessing utilities."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["src/scrna_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
